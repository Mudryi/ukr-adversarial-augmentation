# UA Reviews (5-class sentiment). Mirrors ukr-synonym-robustness/configs/reviews.yaml.
dataset: reviews
nclasses: 5

train-path: ../xml-roberta-finetune-reviews/cross_domain_uk_reviews/train_reviews.csv
eval-path: ../xml-roberta-finetune-reviews/cross_domain_uk_reviews/eval_reviews.csv
test-path: ../xml-roberta-finetune-reviews/cross_domain_uk_reviews/test_reviews.csv

# Primary models for this project (no sbert for now).
models:
  ukr_roberta:
    hf-name: youscan/ukr-roberta-base
    b0-checkpoint: ../xml-roberta-finetune-reviews/trained_models/7ddc/model_7ddc_7_600
  xlmr_base:
    hf-name: xlm-roberta-base
    b0-checkpoint: ../xml-roberta-finetune-reviews/trained_models/tmdk/model_tmdk_7_600

# TODO: verify these B0 checkpoints reproduce results/summary_tables.md before trusting them.
